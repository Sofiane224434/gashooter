name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          script: |
            set -e

            APP_DIR=~/apps/gashooter
            REPO_URL=https://github.com/${{ github.repository }}.git
            COMPOSE_PROJECT=gashooter

            mkdir -p $APP_DIR
            cd $APP_DIR

            if [ -d ".git" ]; then
              git remote set-url origin $REPO_URL
              git fetch origin main
              git reset --hard origin/main
              git clean -fd -e .env
            else
              git clone $REPO_URL $APP_DIR
              cd $APP_DIR
            fi

            # Initialisation .env si inexistant
            if [ ! -f .env ]; then
              JWT_SECRET=$(openssl rand -hex 32 2>/dev/null || date +%s)
              DB_ROOT_PASSWORD=$(openssl rand -hex 16 2>/dev/null || echo "root_secret")
              DB_PASSWORD=$(openssl rand -hex 16 2>/dev/null || echo "gashooter_pass")

              cat <<EOF > .env
PORT=5000
NODE_ENV=production
APP_URL=https://gashooter.azim404.com
CORS_ORIGIN=https://gashooter.azim404.com

DB_HOST=db
DB_USER=gashooter_user
DB_PASSWORD=$DB_PASSWORD
DB_NAME=gashooter_db
DB_ROOT_PASSWORD=$DB_ROOT_PASSWORD

JWT_SECRET=$JWT_SECRET
JWT_EXPIRES_IN=7d

BREVO_API_KEY=
BREVO_SENDER_EMAIL=
BREVO_SENDER_NAME=Gashooter

DEEPL_API_KEY=
EOF
              chmod 600 .env
            fi

            echo "==> Build et demarrage des conteneurs"
            COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT docker compose pull db || true
            COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT docker compose up -d --build --remove-orphans
            docker image prune -f

            echo "==> Configuration Nginx et rechargement"
            if [ -f deploy/nginx/gashooter.azim404.com.conf ]; then
              sudo install -m 0644 deploy/nginx/gashooter.azim404.com.conf /etc/nginx/sites-available/gashooter.azim404.com
              sudo ln -sfn /etc/nginx/sites-available/gashooter.azim404.com /etc/nginx/sites-enabled/gashooter.azim404.com.conf
              sudo nginx -t && sudo systemctl reload nginx
            fi

            echo "==> Verification des conteneurs"
            COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT docker compose ps
