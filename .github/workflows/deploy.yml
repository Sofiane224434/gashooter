name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-gashooter
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy + docker compose
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      APP_DIR: ${{ vars.VPS_APP_DIR }}
      COMPOSE_PROJECT: ${{ vars.VPS_COMPOSE_PROJECT }}
      REPO_URL: https://github.com/${{ github.repository }}.git
      BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout (sanity)
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_PORT:-2222}" -H "${VPS_HOST:-51.210.244.46}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy on VPS
        run: |
          set -euo pipefail
          : "${APP_DIR:=/home/debian/apps/gashooter}"
          : "${COMPOSE_PROJECT:=gashooter}"

          ssh -p "${VPS_PORT:-2222}" "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' REPO_URL='$REPO_URL' BRANCH='$BRANCH' COMPOSE_PROJECT='$COMPOSE_PROJECT' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$APP_DIR"
            git clone "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git remote set-url origin "$REPO_URL"
          git fetch --all --prune
          git reset --hard "origin/$BRANCH"
          git clean -fd -e .env

          if [ ! -f .env ]; then
            cat <<'EOF' > .env
PORT=5000
NODE_ENV=production
APP_URL=https://gashooter.azim404.com
CORS_ORIGIN=https://gashooter.azim404.com

DB_HOST=db
DB_USER=gashooter_user
DB_PASSWORD=gashooter_secret_pass
DB_NAME=gashooter_db
DB_ROOT_PASSWORD=gashooter_root_pass

JWT_SECRET=gashooter_jwt_secret_change_me
JWT_EXPIRES_IN=7d

BREVO_API_KEY=
BREVO_SENDER_EMAIL=
BREVO_SENDER_NAME=Gashooter

DEEPL_API_KEY=
EOF
            chmod 600 .env
          fi

          docker compose -p "$COMPOSE_PROJECT" pull db || true
          docker compose -p "$COMPOSE_PROJECT" up -d --build --remove-orphans
          docker image prune -f >/dev/null 2>&1 || true

          if [ -f deploy/nginx/gashooter.azim404.com.conf ]; then
            sudo -n install -m 0644 deploy/nginx/gashooter.azim404.com.conf /etc/nginx/sites-available/gashooter.azim404.com
            sudo -n ln -sfn /etc/nginx/sites-available/gashooter.azim404.com /etc/nginx/sites-enabled/gashooter.azim404.com.conf
            sudo -n nginx -t && sudo -n systemctl reload nginx
          fi

          if command -v certbot >/dev/null 2>&1; then
            sudo -n certbot --nginx -d gashooter.azim404.com --non-interactive --agree-tos --register-unsafely-without-email --keep-until-expiring >/dev/null 2>&1 || true
            sudo -n systemctl reload nginx || true
          fi

          echo "---- ps ----"
          docker compose -p "$COMPOSE_PROJECT" ps
          REMOTE

      - name: Smoke test (local on runner)
        run: |
          set +e
          curl -skI --max-time 10 https://gashooter.azim404.com | head -n 1 || true
